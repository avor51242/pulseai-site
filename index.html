ензивност и следи пулса в покой.`,"labs.r.tsh.supplement":`Няма добавка за това. Решението е на лекаря.`,"labs.r.tsh.short":`TSH е извън нормата: умерено, първо лекар.`,"labs.r.ferritin.training":`Запасите от желязо са ниски. Тренирай, но не два тежки дни един след друг: ниският феритин се вижда като бавно възстановяване и висок пулс при леко бягане.`,"labs.r.ferritin.recovery":`Възстановяването ти напоследък е ниско и това е правдоподобна причина.`,"labs.r.ferritin.supplement":`Желязо само след като лекарят го потвърди; решава изследване, не догадка. Ако е предписано: с витамин C, на два часа от кафе, чай и калций.`,"labs.r.ferritin.short":`запасите от желязо са ниски, без тежки дни един след друг; питай лекаря за желязо.`,"labs.r.ck.training":`Мускулният ензим е висок, което отговаря на проба ден-два след тежки тренировки. Два леки дни, после повторно изследване. Ако остане висок без тренировки, кажи на лекаря.`,"labs.r.ck.supplement":`Няма какво да вземеш. Вода, сън и протеин на храненията вършат възстановяването.`,"labs.r.ck.short":`мускулният ензим е висок: два леки дни, после повторно изследване.`,"labs.r.vitaminD.training":`Витамин D е нисък. Двадесет минути обедна дневна светлина в леките дни се броят за тренировка за този показател.`,"labs.r.vitaminD.supplement":`Витамин D3 е добавката, с която лекарите най-често са съгласни. Питай за дозата и провери отново след три месеца.`,"labs.r.vitaminD.short":`витамин D е нисък; дневна светлина в леките дни, питай за D3.`,"labs.r.lipids.training":`LDL холестеролът е висок. Зона 2 по 150+ минути седмично плюс две силови тренировки го движат повече от всичко без рецепта.`,"labs.r.lipids.supplement":`Никоя добавка не оправя това. Фибри и омега-3 си струва да попиташ; статинът е решение на лекаря.`,"labs.r.lipids.short":`LDL е висок: повече зона 2 и силови, добавка не го оправя.`,"labs.r.creatinine.training":`Креатининът е висок. Проба след тежка тренировка или сух ден може да излезе висока, затова пий вода и следващата
